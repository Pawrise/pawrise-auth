name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Lint, build & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pawrise_auth
          POSTGRES_PASSWORD: pawrise_auth
          POSTGRES_DB: pawrise_auth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pawrise_auth" --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgresql://pawrise_auth:pawrise_auth@localhost:5432/pawrise_auth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx prisma migrate deploy
      - run: npm run test:all
